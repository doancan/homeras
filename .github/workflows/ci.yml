name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: make verify (iOS)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Select the newest Xcode 27 (ADR-0007; keep in sync with docs/README.md)
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "No Xcode 27 on this runner. Available:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: Packages/AppModules/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/AppModules/Package.resolved') }}
      - run: make setup verify

  database:
    name: make verify-db (RLS and tenant isolation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: make verify-db

  security:
    name: make verify-security (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Runs gitleaks from its pinned Docker image (see GITLEAKS_IMAGE in the Makefile).
      - run: make verify-security
